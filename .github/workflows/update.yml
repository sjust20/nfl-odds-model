name: Update data and deploy

on:
  schedule:
    # 13:00 UTC daily (9am ET): after overnight results, before the early kickoffs.
    - cron: "0 13 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commit the pick log
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Play-by-play for the current season
        run: npm run pbp

      - name: Download games from nflverse
        run: npm run data

      - name: Tests
        run: npm test

      - name: Sportsbook odds (daily, cached)
        run: npm run odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Reuse the deployed copy if it's under 20h old, so pushes don't spend credits.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

      - name: Log upcoming predictions
        run: npm run log-picks

      - name: Commit pick log and play-by-play
        run: |
          git add public/data/pick-log.json data/pbp
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Log upcoming predictions, refresh play-by-play [skip ci]"
            git push
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
